<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Salário</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px} .box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:8px}
label{display:block;margin-top:10px} input,select,button{width:100%;padding:8px;margin-top:4px}
table{width:100%;margin-top:20px;border-collapse:collapse}td{border:1px solid #ccc;padding:6px}
.buttons{display:flex;gap:10px;margin-top:15px}.buttons button{flex:1}
</style></head><body><div class="box"><h2>Calculadora de Salário</h2>
<label>Salário Bruto<input id=sal type=number step=0.01></label>
<label>Carga Horária<select id=carga onchange="cust()"><option>220</option><option>200</option><option>180</option><option>150</option><option value=0>Personalizada</option></select></label>
<input id=custom type=number placeholder="Carga personalizada" style="display:none">
<label>Horas 50%<input id=h50 type=number step=0.01></label>
<label>Horas 100%<input id=h100 type=number step=0.01></label>
<div class=buttons><button onclick="calc()">Calcular</button><button onclick="limpar()">Limpar</button><button onclick="editar()">Editar</button></div>
<table><tbody id=res></tbody></table></div>
<script>
function cust(){custom.style.display=carga.value==0?'block':'none';}
function inss(b){let f=[[1518,.075],[2793.88,.09],[4190.83,.12],[8157.41,.14]],i=0,a=0;for(let x of f){let t=Math.min(b,x[0])-i;if(t>0)a+=t*x[1];i=x[0];if(b<=x[0])break;}return a;}
function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function calc(){
let s=+sal.value,h=+h50.value,z=+h100.value,ch=(+carga.value)||(+custom.value);
let vh=s/ch,v50=vh*1.5,v100=vh*2,t50=h*v50,t100=z*v100,extra=t50+t100,br=s+extra,ins=inss(br),liq=br-ins;
res.innerHTML='';
[['Valor Hora',vh],['Hora 50%',v50],['Total 50%',t50],['Hora 100%',v100],['Total 100%',t100],['Total Extras',extra],['Bruto c/ Extras',br],['INSS',ins],['Líquido',liq]].forEach(r=>res.innerHTML+=`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`);
document.querySelectorAll('input,select').forEach(e=>e.disabled=true);
}
function limpar(){document.querySelectorAll('input').forEach(i=>{i.value='';i.disabled=false});document.querySelectorAll('select').forEach(s=>s.disabled=false);res.innerHTML='';cust();}
function editar(){document.querySelectorAll('input,select').forEach(e=>e.disabled=false);}
cust();
</script></body></html>
